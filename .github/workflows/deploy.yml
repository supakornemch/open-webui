name: Build and deploy Enterprise Chat
on:
  push:
    branches: [qas, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: owui
            dockerfile: docker/Dockerfile.owui
            repository: entchat-owui
          - component: litellm
            dockerfile: docker/Dockerfile.litellm
            repository: litellm-entchat
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: ghcr.io/htc-dio/haadthip-enterprise-chat-${{ matrix.component }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

  deploy:
    needs: build
    if: github.ref_name == 'qas' || github.ref_name == 'main'
    environment: ${{ github.ref_name == 'main' && 'prd' || 'qas' }}
    runs-on: [self-hosted, Windows, X64, deploy, azure]
    concurrency:
      group: enterprise-chat-${{ github.ref_name }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
      id-token: write
    env:
      AZURE_CONFIG_DIR: ${{ github.workspace }}\.azure-cli
      ACR_NAME: ${{ vars.ACR_NAME }}
      RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      OWUI_APP: ${{ vars.OWUI_APP_NAME }}
      LITELLM_APP: ${{ vars.LITELLM_APP_NAME }}
    steps:
      - name: Validate deployment target
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($name in @('ACR_NAME', 'RESOURCE_GROUP', 'OWUI_APP', 'LITELLM_APP')) {
            if (-not [Environment]::GetEnvironmentVariable($name)) { throw "Missing environment variable $name" }
          }
          if ($env:GITHUB_REF_NAME -eq 'qas' -and $env:ACR_NAME -ne 'acrentchatqas') { throw 'QAS registry mismatch' }
          if ($env:GITHUB_REF_NAME -eq 'main' -and $env:ACR_NAME -ne 'acrentchatprd') { throw 'PRD registry mismatch' }
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Install crane and configure registry credentials
        shell: powershell
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://github.com/google/go-containerregistry/releases/download/v0.22.1/go-containerregistry_Windows_x86_64.tar.gz'
          $dir = Join-Path $env:RUNNER_TEMP 'enterprise-chat-crane'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $tgz = Join-Path $dir 'crane.tar.gz'
          Invoke-WebRequest -Uri $url -OutFile $tgz -UseBasicParsing
          tar -xzf $tgz -C $dir
          if ($LASTEXITCODE -ne 0) { throw 'crane extract failed' }
          $crane = Join-Path $dir 'crane.exe'
          if (-not (Test-Path $crane)) { throw 'crane.exe missing' }
          $acrToken = az acr login --name $env:ACR_NAME --expose-token --query accessToken -o tsv
          if ($LASTEXITCODE -ne 0 -or -not $acrToken) { throw 'ACR token failed' }
          $cfg = Join-Path $env:RUNNER_TEMP 'enterprise-chat-registry-config'
          New-Item -ItemType Directory -Force -Path $cfg | Out-Null
          function Auth([string]$pair) { [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($pair)) }
          $json = @{ auths = @{
            'ghcr.io' = @{ auth = (Auth ($env:GITHUB_ACTOR + ':' + $env:GHCR_TOKEN)) }
            ($env:ACR_NAME + '.azurecr.io') = @{ auth = (Auth ('00000000-0000-0000-0000-000000000000:' + $acrToken.Trim())) }
          }} | ConvertTo-Json -Depth 5
          Set-Content -Path (Join-Path $cfg 'config.json') -Value $json -Encoding ascii
          "DOCKER_CONFIG=$cfg" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "CRANE=$crane" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Publish both images and verify digests
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $dateTag = (Get-Date).ToUniversalTime().AddHours(7).ToString('yyyyMMdd-HHmm')
          $owner = '${{ github.repository_owner }}'.ToLowerInvariant()
          foreach ($item in @(@('owui', 'entchat-owui'), @('litellm', 'litellm-entchat'))) {
            $src = "ghcr.io/$owner/haadthip-enterprise-chat-$($item[0]):sha-${{ github.sha }}"
            $dest = "$env:ACR_NAME.azurecr.io/$($item[1])"
            $srcDigest = (& $env:CRANE digest $src).Trim()
            if ($LASTEXITCODE -ne 0 -or $srcDigest -notmatch '^sha256:') { throw "Cannot read source digest: $src" }
            & $env:CRANE copy --platform linux/amd64 $src "${dest}:${dateTag}"
            if ($LASTEXITCODE -ne 0) { throw "Copy failed: $dest" }
            & $env:CRANE tag "${dest}:${dateTag}" latest
            if ($LASTEXITCODE -ne 0) { throw "latest tag failed: $dest" }
            $actual = (& $env:CRANE digest "${dest}:latest").Trim()
            if ($LASTEXITCODE -ne 0 -or $actual -ne $srcDigest) { throw "Digest mismatch: $dest expected $srcDigest got $actual" }
            Write-Host "$($item[1]):$dateTag $actual"
          }
      - name: Restart target apps and verify readiness
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($app in @($env:LITELLM_APP, $env:OWUI_APP)) {
            $expected = if ($app -eq $env:OWUI_APP) { 'entchat-owui' } else { 'litellm-entchat' }
            $fx = az webapp config show -g $env:RESOURCE_GROUP -n $app --query linuxFxVersion -o tsv
            if ($LASTEXITCODE -ne 0 -or $fx -ne "DOCKER|$env:ACR_NAME.azurecr.io/${expected}:latest") { throw "Unexpected image on $app : $fx" }
            az webapp restart -g $env:RESOURCE_GROUP -n $app -o none
            if ($LASTEXITCODE -ne 0) { throw "Restart failed: $app" }
            $ready = $false
            for ($i = 0; $i -lt 30; $i++) {
              Start-Sleep -Seconds 20
              try {
                $resp = Invoke-WebRequest -Uri "https://$app.azurewebsites.net/health/readiness" -UseBasicParsing -TimeoutSec 15
                if ($resp.StatusCode -eq 200) { $ready = $true; break }
              } catch { Write-Host "$app readiness attempt $($i + 1) failed" }
            }
            if (-not $ready) { throw "$app readiness failed after restart" }
            Write-Host "$app readiness=200"
          }
      - name: Remove temporary credentials
        if: always()
        shell: powershell
        run: |
          if ($env:DOCKER_CONFIG -and (Test-Path $env:DOCKER_CONFIG)) { Remove-Item -Recurse -Force $env:DOCKER_CONFIG }
          if ($env:AZURE_CONFIG_DIR -and (Test-Path $env:AZURE_CONFIG_DIR)) { Remove-Item -Recurse -Force $env:AZURE_CONFIG_DIR }

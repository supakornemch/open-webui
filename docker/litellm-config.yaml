# LiteLLM Configuration — EnterpriseChat POC
# Proxies Azure AI Foundry models through LiteLLM for token tracking & cost monitoring
#
# Usage:
#   1. Set env vars:
#        export AZURE_API_KEY="your-key"
#        export AZURE_API_BASE="https://aif-entchat-poc-sand.cognitiveservices.azure.com"
#        export LITELLM_MASTER_KEY="sk-litellm-poc-master-key"
#        export DATABASE_URL="postgresql://..."
#        export AZURE_SEARCH_API_KEY="your-search-key"
#        export AZURE_SEARCH_SERVICE_NAME="srch-entchat-poc-sand"
#   2. Run: docker compose -f config/docker-compose.litellm.yml up -d
#   3. Open WebUI → set OpenAI API Base to http://localhost:4000/v1
#
# Models: added via DB (POST /model/new or /ui), not in model_list.

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  sso_settings:
    - sso_type: 'microsoft'
      client_id: os.environ/MICROSOFT_CLIENT_ID
      client_secret: os.environ/MICROSOFT_CLIENT_SECRET
      tenant: os.environ/MICROSOFT_TENANT

litellm_settings:
  set_verbose: true
  drop_params: true
  request_timeout: 120
  timezone: 'Asia/Bangkok'
  cache: True
  cache_params:
    type: local
    ttl: 3600
  # ponytail: semantic filter off — defaults to text-embedding-3-small (not deployed).
  # semantic_router lib ignores our embedding_model config. Enable when we deploy
  # text-embedding-3-small, or LiteLLM fixes the config passthrough.
  mcp_semantic_tool_filter:
    enabled: false
  # MCP Gateway — expose MCP tools at fixed endpoint, access controlled by Key/Team
  # ponytail: postgres MCP needs the DB URL as a CLI arg (not env var).
  #           Hardcoded Azure PG connection string; password URL-encoded.
  mcp_servers:
    # ── PostgreSQL: query the LiteLLM/Open WebUI DBs ──
    postgres:
      transport: 'stdio'
      command: 'npx'
      args:
        - '-y'
        - '@modelcontextprotocol/server-postgres'
        - 'postgresql://entchatadm:DocWiseP%40ssw0rd2026%21@psql-entchat-poc-sand.postgres.database.azure.com:5432/litellm?sslmode=require'

    # ── Filesystem: read project docs ──
    filesystem:
      transport: 'stdio'
      command: 'npx'
      args:
        - '-y'
        - '@modelcontextprotocol/server-filesystem'
        - '/app/workspace'
      # ponytail: mount project docs at /app/workspace in the container

    # ── Time: current time / timezone ──
    time:
      transport: 'stdio'
      command: 'npx'
      args: ['-y', '@guanxiong/mcp-server-time']

    # ── Context7: up-to-date library docs ──
    context7:
      transport: 'stdio'
      command: 'npx'
      args: ['-y', '@upstash/context7-mcp']

# ponytail: vector_store_registry disabled — LiteLLM v1.83.3 doesn't route
# /v1/vector_stores/{name}/search to registered azure_ai stores (defaults to OpenAI).

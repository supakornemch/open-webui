# LiteLLM Configuration — Local Dev
general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  # Omitting database_url here does NOT disable the DB — LiteLLM still reads the
  # DATABASE_URL env var and migrates it. compose.yml pins it to the local
  # /litellm database.

litellm_settings:
  set_verbose: true
  drop_params: true
  request_timeout: 120
  timezone: 'Asia/Bangkok'
  cache: True
  cache_params:
    type: local
    ttl: 3600
  disable_message_cache: True

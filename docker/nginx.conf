# Open WebUI — nginx reverse proxy with CSP headers for Teams/SharePoint iframe
# Replaces start-wrapper.py TCP proxy with proper HTTP reverse proxy.

# Determine correct scheme (preserve original X-Forwarded-Proto from Azure App Service)
map $http_x_forwarded_proto $forwarded_proto_scheme {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 8080 default_server;
    server_name _;

    # ── Accept large file uploads (OWUI Knowledge base) ──
    client_max_body_size 100M;
    client_body_timeout 300s;

    # ── CSP: Allow Teams/SharePoint/Microsoft domains to embed in iframe ──
    add_header Content-Security-Policy "frame-ancestors 'self' *.microsoft.com *.sharepoint.com *.onedrive.com *.teams.microsoft.com *.cloud.microsoft;";

    # ── HSTS: Force HTTPS for 1 year (VA Report fix) ──
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ── Intercept auth endpoint to bridge Teams token if logged in ──
    location = /auth {
        if ($cookie_token) {
            rewrite ^ /teams-auth-bridge.html last;
        }
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto_scheme;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    # ── Proxy all requests to Open WebUI on 8081 ──
    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto_scheme;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    # ── Health check for Azure App Service ──
    location /health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }
}

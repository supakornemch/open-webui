# EnterpriseChat — Local Compose for Teams Auth Testing
# Builds custom Open WebUI (with teams-auth.html + Azure AI Search backend) + LiteLLM
#
# Usage:
#   docker compose -f docker/compose.yml up -d --build
#
# Secrets are in docker/.env (gitignored). Copy .env.example first:
#   cp docker/.env.example docker/.env
#
# Open WebUI:  http://localhost:3000
# LiteLLM:     http://localhost:4000
# LiteLLM UI:  http://localhost:4000/ui

name: enterprisechat-local
services:
  # ============================================================
  # Open WebUI — Chat Interface (custom image)
  # ============================================================
  open-webui:
    build:
      context: ..
      dockerfile: docker/Dockerfile.owui
    image: owui-entchat-teams:local
    container_name: open-webui-local
    ports:
      - "3000:8080"
    volumes:
      - ../data/open-webui:/app/backend/data
    env_file:
      - .env
    environment:
      # ---- Vector DB: Azure AI Search (custom backend) ----
      - VECTOR_DB=azure-ai-search
      - AZURE_SEARCH_ENDPOINT=https://srch-entchat-poc-sand.search.windows.net
      - AZURE_SEARCH_ADMIN_KEY=${AZURE_SEARCH_ADMIN_KEY}
      - AZURE_SEARCH_TYPE=hybrid
      - AZURE_ENABLE_SEMANTIC_SEARCH=false
      - AZURE_SEARCH_NAMESPACE_MODE=true
      # ---- LLM ----
      - OPENAI_API_BASE_URL=http://litellm:4000/v1
      # ---- OWUI general ----
      - WEBUI_URL=http://localhost:3000
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY:-local-dev-secret-key}
      - ENABLE_OAUTH_SIGNUP=true
      - OAUTH_MERGE_ACCOUNTS_BY_EMAIL=true
      # ---- Microsoft Entra ID SSO ----
      - MICROSOFT_CLIENT_ID=${MICROSOFT_CLIENT_ID:-4881351e-d1a0-4228-a084-a0d6ef717740}
      - MICROSOFT_CLIENT_SECRET=${MICROSOFT_CLIENT_SECRET}
      - MICROSOFT_CLIENT_TENANT_ID=${MICROSOFT_CLIENT_TENANT_ID:-5045d9c3-3b0b-4315-8594-64118bbd7495}
      - MICROSOFT_REDIRECT_URI=${MICROSOFT_REDIRECT_URI:-http://localhost:3000/oauth/microsoft/callback}
      - MICROSOFT_OAUTH_SCOPE=${MICROSOFT_OAUTH_SCOPE:-openid email profile offline_access}
      - OPENID_PROVIDER_URL=${OPENID_PROVIDER_URL:-https://login.microsoftonline.com/5045d9c3-3b0b-4315-8594-64118bbd7495/v2.0/.well-known/openid-configuration}
      # ---- Document Intelligence (PDF extraction) ----
      - CONTENT_EXTRACTION_ENGINE=${CONTENT_EXTRACTION_ENGINE:-document_intelligence}
      - DOCUMENT_INTELLIGENCE_ENDPOINT=${DOCUMENT_INTELLIGENCE_ENDPOINT:-https://aif-entchat-poc-sand.cognitiveservices.azure.com/}
      - DOCUMENT_INTELLIGENCE_KEY=${DOCUMENT_INTELLIGENCE_KEY}
      - DOCUMENT_INTELLIGENCE_MODEL=${DOCUMENT_INTELLIGENCE_MODEL:-prebuilt-read}
    depends_on:
      litellm:
        condition: service_started
    restart: unless-stopped
    networks:
      - entchat-net

  # ============================================================
  # LiteLLM — LLM Proxy for Token Tracking & Cost Monitoring
  # ============================================================
  litellm:
    build:
      context: ..
      dockerfile: docker/Dockerfile.litellm
    image: litellm-entchat:local
    container_name: litellm-poc
    ports:
      - "4000:4000"
    volumes:
      - ./litellm-config.local.yaml:/app/config.yaml:ro
    env_file:
      - .env
    environment:
      - AZURE_API_BASE=${AZURE_API_BASE:-https://aif-entchat-poc-sand.cognitiveservices.azure.com}
      - AZURE_API_KEY=${AZURE_API_KEY}
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY:-sk-litellm-poc-master-key}
      # No DATABASE_URL = SQLite fallback for local testing
    command:
      - "--config"
      - "/app/config.yaml"
      - "--port"
      - "4000"
    restart: unless-stopped
    networks:
      - entchat-net

networks:
  entchat-net:
    driver: bridge

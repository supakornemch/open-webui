# LiteLLM — Docker Compose for EnterpriseChat POC
#
# Usage:
#   export AZURE_API_KEY="your-azure-foundry-key"
#   export AZURE_API_BASE="https://aif-entchat-poc-sand.cognitiveservices.azure.com"
#   export DATABASE_URL="postgresql://entchatadm:DocWiseP%40ssw0rd2026%21@psql-entchat-poc-sand.postgres.database.azure.com:5432/litellm?sslmode=require"
#   export AZURE_SEARCH_API_KEY="your-search-key"
#   docker compose -f config/docker-compose.litellm.yml up -d
#
# Then point Open WebUI to: http://localhost:4000/v1
# LiteLLM UI: http://localhost:4000/ui

services:
  litellm:
    # ponytail: local custom image (has Node.js + MCP packages).
    # For Azure deploy: use acr...azurecr.io/litellm-entchat:latest (see Dockerfile.litellm)
    build:
      context: .
      dockerfile: Dockerfile.litellm
    image: litellm-entchat:latest
    container_name: litellm-poc
    ports:
      - "4000:4000"
    volumes:
      - ./litellm_config.yaml:/app/config.yaml:ro
    environment:
      - AZURE_API_KEY=${AZURE_API_KEY}
      - AZURE_API_BASE=${AZURE_API_BASE:-https://aif-entchat-poc-sand.cognitiveservices.azure.com}
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY:-sk-litellm-poc-master-key}
      # DB (Azure PG) — required for model persistence, token tracking, vector store
      - DATABASE_URL=${DATABASE_URL}
      # Azure AI Search — for vector store registry
      - AZURE_SEARCH_API_KEY=${AZURE_SEARCH_API_KEY}
      - AZURE_SEARCH_SERVICE_NAME=${AZURE_SEARCH_SERVICE_NAME:-srch-entchat-poc-sand}
    command:
      - "--config"
      - "/app/config.yaml"
      - "--port"
      - "4000"
    restart: unless-stopped
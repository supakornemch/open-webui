# LiteLLM — Standalone (Azure PG)
# For full stack with custom OWUI + SQLite: docker compose -f docker-compose.local.yml up -d
#
# Usage:
#   export AZURE_API_KEY="your-azure-foundry-key"
#   export DATABASE_URL="postgresql://..."
#   docker compose -f config/docker-compose.litellm.yml up -d
#
# Then point Open WebUI to: http://localhost:4000/v1
# LiteLLM UI: http://localhost:4000/ui

services:
  litellm:
    # ponytail: local custom image (has Node.js + MCP packages).
    # For Azure deploy: use acr...azurecr.io/litellm-entchat:latest (see Dockerfile.litellm)
    build:
      context: .
      dockerfile: Dockerfile.litellm
    image: litellm-entchat:latest
    container_name: litellm-poc
    ports:
      - "4000:4000"
    volumes:
      - ./litellm_config.yaml:/app/config.yaml:ro
    env_file:
      - ./docker.env
    environment:
      - AZURE_API_BASE=${AZURE_API_BASE:-https://aif-entchat-poc-sand.cognitiveservices.azure.com}
      # DB (Azure PG) — required for model persistence, set in docker.env or skip for in-memory
      - DATABASE_URL=${DATABASE_URL}
      - AZURE_SEARCH_SERVICE_NAME=${AZURE_SEARCH_SERVICE_NAME:-srch-entchat-poc-sand}
    command:
      - "--config"
      - "/app/config.yaml"
      - "--port"
      - "4000"
    restart: unless-stopped
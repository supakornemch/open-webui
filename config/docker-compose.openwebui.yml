# Open WebUI — Local (standalone, no LiteLLM network)
# Requires LiteLLM running separately on localhost:4000
#
# For full stack with LiteLLM, use: docker compose -f docker-compose.local.yml up -d --build
#
# Usage:
#   docker compose -f config/docker-compose.openwebui.yml up -d
#
# Open WebUI:    http://localhost:3000

services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui-local
    ports:
      - "3000:8080"
    volumes:
      - ../data/open-webui:/app/backend/data
    env_file:
      - ./docker.env
    environment:
      # Uses host.docker.internal to reach LiteLLM running on host
      - OPENAI_API_BASE_URL=http://host.docker.internal:4000/v1
      - WEBUI_URL=http://localhost:3000
      - ENABLE_OAUTH=true
      - OAUTH_PROVIDER_NAME=microsoft
      - MICROSOFT_CLIENT_ID=4881351e-d1a0-4228-a084-a0d6ef717740
      - MICROSOFT_CLIENT_TENANT_ID=5045d9c3-3b0b-4315-8594-64118bbd7495
      - OAUTH_SCOPES=openid email profile
      - OAUTH_MERGE_ACCOUNTS_BY_EMAIL=True
    restart: unless-stopped

volumes:
  open-webui-data:

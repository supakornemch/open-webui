# EnterpriseChat — Local Compose for Teams Auth Testing
# Builds custom Open WebUI (with teams-auth.html) + LiteLLM
#
# Prerequisites:
#   export AZURE_API_KEY="your-azure-foundry-key"
#   export LITELLM_MASTER_KEY="sk-litellm-poc-master-key"  # or use default
#
# Usage:
#   docker compose -f deploy/docker/docker-compose.local.yml up -d --build
#
# Open WebUI:  http://localhost:3000
# LiteLLM:     http://localhost:4000
# LiteLLM UI:  http://localhost:4000/ui

name: enterprisechat-local
services:
  # ============================================================
  # Open WebUI — Chat Interface (custom image with teams-auth.html)
  # ============================================================
  open-webui:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.teams
    image: owui-entchat-teams:local
    container_name: open-webui-local
    ports:
      - "3000:8080"
    volumes:
      - ../../data/open-webui:/app/backend/data
    env_file:
      - ./docker.env
    environment:
      - OPENAI_API_BASE_URL=http://litellm:4000/v1
      # ---- Microsoft Entra ID SSO ----
      - WEBUI_URL=http://localhost:3000
      - ENABLE_OAUTH=true
      - OAUTH_PROVIDER_NAME=microsoft
      - MICROSOFT_CLIENT_ID=4881351e-d1a0-4228-a084-a0d6ef717740
      - MICROSOFT_CLIENT_TENANT_ID=5045d9c3-3b0b-4315-8594-64118bbd7495
      - OAUTH_SCOPES=openid email profile
      - OAUTH_MERGE_ACCOUNTS_BY_EMAIL=True
    depends_on:
      litellm:
        condition: service_started
    restart: unless-stopped
    networks:
      - entchat-net

  # ============================================================
  # LiteLLM — LLM Proxy for Token Tracking & Cost Monitoring
  # ============================================================
  litellm:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.litellm
    image: litellm-entchat:local
    container_name: litellm-poc
    ports:
      - "4000:4000"
    volumes:
      - ../litellm/litellm_config.local.yaml:/app/config.yaml:ro
    env_file:
      - ./docker.env
    environment:
      - AZURE_API_BASE=${AZURE_API_BASE:-https://aif-entchat-poc-sand.cognitiveservices.azure.com}
      # No DATABASE_URL = SQLite fallback for local testing
    command:
      - "--config"
      - "/app/config.yaml"
      - "--port"
      - "4000"
    restart: unless-stopped
    networks:
      - entchat-net

networks:
  entchat-net:
    driver: bridge

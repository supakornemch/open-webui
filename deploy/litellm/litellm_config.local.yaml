# LiteLLM Configuration — Local Dev (SQLite)
general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  # No database_url = SQLite fallback (for local testing)

litellm_settings:
  set_verbose: true
  drop_params: true
  request_timeout: 120
  cache: True
  cache_params:
    type: local
    ttl: 3600

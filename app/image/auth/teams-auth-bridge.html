<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>Genie — Authenticated</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #006600;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      text-align: center;
    }
    .container {
      padding: 2rem;
    }
    .spinner {
      display: inline-block;
      width: 30px; height: 30px;
      border: 3px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin-bottom: 1rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="container">
    <div class="spinner"></div>
    <div>✅ ลงชื่อเข้าใช้สำเร็จ กำลังนำท่านกลับไปที่แอป...</div>
  </div>

  <!-- Microsoft Teams Client SDK -->
  <script src="https://res.cdn.office.net/teams-js/2.22.0/js/MicrosoftTeams.min.js"></script>
  <script>
    (async function() {
      'use strict';
      
      // Initialize Teams SDK
      try {
        await microsoftTeams.app.initialize();
      } catch (_) {}

      // Extract JWT token from cookie
      const token = document.cookie.split('; ')
        .find(row => row.startsWith('token='))
        ?.split('=')[1];

      if (token) {
        let notified = false;

        // 1. Try to notify Teams SDK
        try {
          microsoftTeams.authentication.notifySuccess(token);
          notified = true;
        } catch (_) {}

        // 2. Try postMessage for standard browser popup fallback
        try {
          if (window.opener) {
            window.opener.postMessage(
              { type: 'TEAMS_AUTH_SUCCESS', token: token },
              window.location.origin
            );
            notified = true;
          }
        } catch (_) {}

        // Close popup if possible
        if (notified) {
          try { window.close(); } catch (_) {}
        } else {
          // If not in a popup or Teams, redirect to home page
          window.location.replace('/');
        }
      } else {
        // Fallback if token not found
        window.location.replace('/teams-auth.html');
      }
    })();
  </script>
</body>
</html>
